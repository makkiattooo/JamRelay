name: Container release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this version to GHCR (explicit release action)
        type: boolean
        default: false
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - id: version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo 'Release tag must match package version'; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        if: github.ref_type == 'tag' || inputs.publish
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref_type == 'tag' || inputs.publish }}
          tags: ghcr.io/makkiattooo/jamrelay:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
