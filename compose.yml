services:
  app:
    container_name: jamrelay_app
    build: .
    restart: unless-stopped

    env_file:
      - .env

    environment:
      JAMRELAY_DATA_DIR: /data
      PORT: 5267

    ports:
      - '127.0.0.1:5267:5267'

    volumes:
      - jamrelay_data:/data

    networks:
      - jamrelay_internal

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    read_only: true

    tmpfs:
      - /tmp

    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:' + process.env.PORT + '/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  tunnel:
    container_name: jamrelay_tunnel
    image: cloudflare/cloudflared:latest
    restart: unless-stopped

    command: ['tunnel', '--no-autoupdate', 'run', '--token', '${CLOUDFLARE_TUNNEL_TOKEN}']

    networks:
      - jamrelay_internal

volumes:
  jamrelay_data:
    external: true
    name: jamrelay_data

networks:
  jamrelay_internal:
    external: true
    name: jamrelay_internal
