services:
  jamrelay:
    build: .
    image: jamrelay:local
    restart: unless-stopped
    init: true
    stdin_open: true
    tty: true
    environment:
      JAMRELAY_INSTALL_MODE: docker
      JAMRELAY_CONFIG_PATH: /data/jamrelay.env
      JAMRELAY_DATA_DIR: /data
      JAMRELAY_HOST_PORT: ${JAMRELAY_PORT:-5267}
      HOST: 0.0.0.0
      PORT: 5267
    ports:
      - '${JAMRELAY_BIND_ADDRESS:-127.0.0.1}:${JAMRELAY_PORT:-5267}:5267'
    volumes:
      - jamrelay_data:/data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    stop_grace_period: 30s
volumes:
  jamrelay_data:
    name: ${JAMRELAY_VOLUME_NAME:-jamrelay_data}
