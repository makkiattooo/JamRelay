services:
  tunelink:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - ./data:/data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
